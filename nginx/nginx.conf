user nginx;
worker_processes auto;
worker_rlimit_nofile 1024;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '$request_time';

    access_log /var/log/nginx/access.log main;

    # Basic optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # --------------------------------------------------------
    # CORS Origin Mapping
    # --------------------------------------------------------
    # Why use a map instead of a simple add_header?
    # Browsers do not allow multiple origins in the Access-Control-Allow-Origin header.
    # By mapping the $http_origin (what the browser sends) against regex patterns,
    # we can dynamically echo back the exact origin IF it matches our allowed list.
    # If it doesn't match, we return an empty string, blocking the CORS request.
    map $http_origin $cors_origin {
        ~^https://([a-zA-Z0-9-]+\.)*rajivwallace\.com$ $http_origin;
        ~^http://localhost:(3000|5173)$ $http_origin;
        ~^http://127\.0\.0\.1:(3000|5173)$ $http_origin;
        default "";
    }

    # --------------------------------------------------------
    # Upstream Definitions
    # --------------------------------------------------------
    # Why define upstreams?
    # 1. Abstracts the physical location/port of the backend from the routing logic.
    # 2. Enables Keep-Alive connections between Nginx and the backend, significantly
    #    reducing TCP handshake overhead for high-throughput APIs.
    # --------------------------------------------------------
    # Upstream Django backend
    upstream trivia_backend {
        server trivia-backend:8000;
        keepalive 32;
    }

    # --------------------------------------------------------
    # Rate Limiting Zones (DDoS Protection)
    # --------------------------------------------------------
    # How it works:
    # Allocates 10MB of memory for tracking client IPs (`zone=name:10m`).
    # Limits requests per second. `rate=10r/s` means 1 request every 100ms.
    # If a user exceeds this, Nginx queues them (burst) or drops them instantly.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=static:10m rate=30r/s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;

    # --------------------------------------------------------
    # 1. FRONTEND SERVER (Static SPA Serving)
    # --------------------------------------------------------
    server {
        listen 80 default_server;
        server_name trivia.rajivwallace.com www.trivia.rajivwallace.com localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Nginx health check (required for Docker)
        location /nginx-status/ {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.0.0.0/8;
            deny all;
        }

        # Immutable Vite hashed assets
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            try_files $uri =404;
        }

        # React SPA client-side routing fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
    }

    # --------------------------------------------------------
    # 2. BACKEND API & ADMIN SERVER
    # --------------------------------------------------------
    server {
        listen 80;
        server_name trivia-api.rajivwallace.com trivia-nginx;

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Static files
        location /static/ {
            limit_req zone=static burst=50 nodelay;
            alias /usr/share/nginx/html/static/;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header Vary Accept-Encoding always;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Vary Origin always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            try_files $uri $uri/ =404;
        }

        location ~ ^/metrics/?$ {
            allow 172.0.0.0/8;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://trivia_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # API endpoints
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Vary Origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Vary Origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header X-Content-Type-Options nosniff always;
                add_header X-Frame-Options DENY always;
                add_header X-XSS-Protection "1; mode=block" always;
                add_header Referrer-Policy strict-origin-when-cross-origin always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            proxy_pass http://trivia_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Admin interface
        location /admin/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://trivia_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Django health check
        location /health/ {
            proxy_pass http://trivia_backend/health/;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # API Root fallback
        location / {
            proxy_pass http://trivia_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
