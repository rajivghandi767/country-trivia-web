[project]
name = "country-trivia-web-backend"
version = "0.1.0"
description = "Backend API and AI Grading Engine for Country Trivia Web"
requires-python = ">=3.14"
dependencies = [
    "django",
    "django-prometheus",
    "djangorestframework",
    "google-genai",
    "rapidfuzz",
    "redis",
]

[dependency-groups]
prod = [
    "gunicorn",
    "psycopg",
]
dev = [
    "django-cors-headers",
    "django-stubs[compatible-mypy]>=5.1.3",
    "djangorestframework-stubs[compatible-mypy]>=3.15.3",
    "mypy>=1.15.0",
    "psycopg[binary]",
]

