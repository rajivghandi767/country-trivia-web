[project]
name = "country-trivia-web-backend"
version = "0.1.0"
description = "Backend API and AI Grading Engine for Country Trivia Web"
requires-python = ">=3.14"
dependencies = [
    "django",
    "django-prometheus",
    "django-redis",
    "djangorestframework",
    "google-generativeai",
    "rapidfuzz",
    "requests",
]

[dependency-groups]
prod = [
    "gunicorn",
    "psycopg",
]
dev = [
    "django-cors-headers",
    "psycopg[binary]",
    "pytest",
    "pytest-django",
]
